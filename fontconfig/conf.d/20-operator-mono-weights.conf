<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Operator Mono's files carry odd weights (Book 52.5, Medium 55, Bold 80 — fontconfig's
     "regular"), so asking for a regular face got Bold. Set them right as they're scanned
     (needs `fc-cache -f` after a change). Kitty and the shell both read these. -->
<fontconfig>
  <match target="scan">
    <test name="family"><string>Operator Mono</string></test>
    <test name="style" compare="contains"><string>Extra Light</string></test>
    <edit name="weight" mode="assign"><const>extralight</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Operator Mono</string></test>
    <test name="style" compare="contains"><string>Book</string></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Operator Mono</string></test>
    <test name="style" compare="contains"><string>Medium</string></test>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Operator Mono</string></test>
    <test name="style" compare="contains"><string>Bold</string></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
</fontconfig>
