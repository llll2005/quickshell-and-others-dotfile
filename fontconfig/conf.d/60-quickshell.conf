<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The shell's type, for the Quickshell process only (prgname is the real executable,
     "quickshell", also when started as qs), whose fallback chain becomes
       the face asked for → Operator Mono → 金萱 → the system's
     · text with no family set is Operator Mono; so are the glyphs a face lacks (fontconfig
       tags any sans with a generic sans-serif, which is what the first rule tests)
     · Chinese lands on 金萱 (Qt doesn't pair a CJK face on its own: Noto Sans CJK otherwise)
     Other programs are untouched. quickshell/CLAUDE.md "Design language" · Type. -->
<fontconfig>
  <match target="pattern">
    <test name="prgname" compare="eq"><string>quickshell</string></test>
    <test name="family" qual="any" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Operator Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="prgname" compare="eq"><string>quickshell</string></test>
    <test name="family" qual="first" compare="not_eq"><string>-</string></test>
    <edit name="family" mode="append" binding="strong"><string>jf金萱那提2.0</string></edit>
  </match>
</fontconfig>
