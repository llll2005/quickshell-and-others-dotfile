# ╔════════════════════════════════════════════════════════════════╗
# ║  Quickshell（NieR）設定檔                                        ║
# ║  改完存檔即時生效，不需重啟。格式：[區段]、key = value、# 註解     ║
# ║  值：true/false、數字、文字；要保留 # 之類字元就用 "引號"          ║
# ║  沒寫到的項目一律用程式內建預設值                                  ║
# ║  也可以用設定面板改（SUPER+ALT+S）：會寫回這個檔案、保留註解       ║
# ╚════════════════════════════════════════════════════════════════╝

[general]
theme = nier            # 主題：config/themes/<名稱>.conf（例：nier、yorha-noir）
scale = 1.0             # 全域尺寸倍率（Settings.s()）

[font]                  # 全系統的字（shell 與 kitty 同一組）+ 虛空（鎖屏、授權、關機過場）的字與字級
mono = Operator Mono    # 系統標籤、數字、內文；空白 = 主題的
cjk = jf金萱那提2.0     # 中文；其他字缺的中文也會落到這裡
size = 0                # 全域字級：虛空以外的文字，一級 ×1.09（設定面板 LOOK 頁可調）
void = Josefin Sans     # 字型（~/.local/share/fonts）；空白 = 主題的 mono
voidWeight = 300        # 字重：300 Light · 400 Regular
voidRatio = 1.618       # 字級比例：1.618 黃金（落差最大）· 1.5 · 1.333 · 1.25（最平緩）
voidBase = 12           # 最小一級（標籤）在 1080p 的像素；其餘 = 它 × 比例^k
voidClockStep = 5       # 鎖屏時鐘用第幾級（12 × 1.618⁵ ≈ 133）

[void]                  # 虛空的顏色：固定，不跟主題
light = #ffffff         # 文字與線條：白
warn = #b8403c          # 失敗、警告：暗紅

[hud]
enabled = true          # 右上角 HUD（狀態、月曆、工作區、OSD、歌詞）
hideDelay = 1400        # 游標離開後多久收回（ms）
osdDuration = 1700      # 音量/亮度提示停留（ms）
trackToast = true       # 換歌時 HUD 彈出曲名（Spotify、YouTube、bilibili…）

[backdrop]              # 彈窗背景的玻璃三角形
opacity = 0.42          # 三角形不透明度（越小越透）
dim = 0.28              # 背景變暗程度
cellSize = 180          # 三角形大小（px）
flicker = 0.6           # 隨機閃動強度（0 = 靜止）

[effects]
click = true            # 點擊視窗時的鑽石爆發（需 imecaret 外掛）
burstSize = 0.7         # 點擊/打字爆發的大小
windowOpen = true       # 開視窗：像素憑空拼出視窗（需 imecaret 外掛）
windowClose = true      # 關視窗：向下溶解（會關掉 Hyprland 自己的關窗滑出）
focusReticle = true     # 切換焦點：鎖定準星框住新視窗
focusReticleHover = false   # 滑鼠移過就換焦點時也顯示準星

[ime]                   # fcitx5 選字框
panel = true            # true = Quickshell 選字框；false = fcitx5 原生選字框（配色見 [sync]）
sparks = true           # 打字時的菱形粒子

[lyrics]                # 同步歌詞（顯示在 HUD；qs ipc call hud lyrics 開關）
enabled = true          # 預設開啟；找不到歌詞時不會顯示
offset = 0              # 秒；歌詞比歌聲慢就調正數（例：0.3）

[sync]                  # 讓桌面其他部分跟著主題變色（scripts/theme-sync.py）
fcitx5 = true           # fcitx5 原生選字框用主題色；false = 回到固定的 nier 主題
hyprland = true         # 視窗邊框/光暈用主題的 [hyprland]；false = 回到 hypr/ui/theme.lua 的配色
terminal = true         # kitty、zsh 提示符與工具（fzf、bat、delta、atuin）的配色跟著主題；false = kitty.conf 自己的配色

[capture]               # 截圖面板
freeze = true           # 區域選取時凍結畫面
style = iris            # 開關動畫：wipe · rise · scan · iris · blinds

[notifications]
timeout = 5000          # 一般通知停留（ms）
criticalTimeout = 10000 # 緊急通知停留（ms）
history = 50            # 歷史保留則數

[player]
background = true       # 深色底
positionY = 0.39        # 垂直位置（0 = 頂端，1 = 底端）
marginRight = 20        # 距右邊界（px）
width = 420             # 寬度（px）

[companions]
enabled = false
marginRight = 20
spriteSize = 128
