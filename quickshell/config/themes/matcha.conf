# Matcha — 抹茶和紙：米黃和紙、深抹茶墨、紅豆色點綴（推薦）

[palette]
paper     = #e5e1c8
ink       = #3c4a30
inkStrong = #263019
inkSoft   = #7d8468
accent    = #8f3b2e     # 紅豆
light     = #fbf8e6
warn      = #c96a50
good      = #8fb07a

[dark]
panel    = #1a1f16
raised   = #262d20
text     = #e5e1c8
muted    = #8f9380
monitors = #fbf8e6, #a9c48c, #d8b07a, #c96a50
monthTint = 0.25       # HUD 下半部融入月曆原畫色調的程度（0 = 不融入）

[notify]
critical = #c96a50
low      = #a9c48c

[sepia]
fg  = #dfe0c8
bg  = #11140e
dim = #3b4234

[backdrop]
triangle = #dcd8bd
glint    = #fbf8e6
shade    = #2f3a26

[hyprland]              # 視窗邊框（scripts/theme-sync.py；shell.conf 的 [sync] hyprland 開關）
border      = #a9c48c, #e5e1c8, #8f3b2e   # 作用中視窗的漸層，2–3 色
borderAngle = 45
shadow      = #a9c48c     # 作用中視窗的光暈
