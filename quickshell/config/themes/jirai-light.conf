# Jirai Light — 淺色地雷系：粉白蕾絲的卡片、黑緞帶的字與選取條、桃紅的邊；HUD 也翻成淺色

[palette]
paper     = #fff0f5     # 粉白卡片
ink       = #2a1d25     # 黑緞帶：字、線、選取條
inkStrong = #140c11
inkSoft   = #a37c8f
accent    = #ff5c93     # 桃紅：選取條邊緣、標記
light     = #ff7aa8     # 粉色閃光、高光
warn      = #e8356f
good      = #2f8a68     # 薄荷（淺底上要夠深才讀得到）

[dark]                  # HUD（淺色）
panel    = #fde6ef
raised   = #f5cfdd      # 軌道
text     = #2a1d25
muted    = #9a7488
active   = #d6336c      # 選中日期、釘選、標記（淺色 HUD 要比 light 深）
onFill   = #ffffff      # 實心色塊上的字（選中的分頁/列、日期、工作區）
monitors = #d6336c, #2a1d25, #8a5cc4, #3a9e7a
monthTint = 0.06      # HUD 下半部融入月曆原畫色調的程度（0 = 不融入）

[notify]
critical = #e8356f
low      = #8a5cc4

[sepia]                 # 播放器
fg  = #2a1d25
bg  = #fde6ef
dim = #f0b8cc

[backdrop]
triangle = #fff0f5
glint    = #ffffff
shade    = #c98aa4      # 暗面用灰玫瑰，玻璃才會是淺的

[hyprland]              # 視窗邊框（scripts/theme-sync.py；shell.conf 的 [sync] hyprland 開關）
border      = #ff7aa8, #ffd1e1, #2a1d25   # 作用中視窗的漸層，2–3 色
borderAngle = 45
shadow      = #ff7aa8     # 作用中視窗的光暈
