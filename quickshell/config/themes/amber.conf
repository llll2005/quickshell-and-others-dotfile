# Amber — 琥珀終端：黑底琥珀字的復古 CRT 螢幕（推薦）

[palette]
paper     = #140e07     # 黑底
ink       = #ffb347     # 琥珀：字、線、選取條
inkStrong = #ffd699
inkSoft   = #a9793a
accent    = #ff6a2b
light     = #fff1d6
warn      = #ff6a2b
good      = #c8d86a

[dark]
panel    = #0c0803
raised   = #1a1209
text     = #ffb347
muted    = #9c7440
monitors = #fff1d6, #ffb347, #c8d86a, #ff6a2b
monthTint = 0.15       # HUD 下半部融入月曆原畫色調的程度（0 = 不融入）

[notify]
critical = #ff6a2b
low      = #c8d86a

[sepia]
fg  = #ffb347
bg  = #0a0703
dim = #4a3413

[backdrop]
triangle = #241808
glint    = #ffd699
shade    = #070401

[hyprland]              # 視窗邊框（scripts/theme-sync.py；shell.conf 的 [sync] hyprland 開關）
border      = #ffb347, #ff6a2b, #fff1d6   # 作用中視窗的漸層，2–3 色
borderAngle = 45
shadow      = #ff6a2b     # 作用中視窗的光暈
