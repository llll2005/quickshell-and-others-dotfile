# NieR — 紙與墨（預設主題）
# 顏色名稱是「用途」不是色相：paper = 卡片底、ink = 寫在上面的字與線。
# 顏色格式：#RRGGBB，或帶透明度的 #AARRGGBB（Qt 的順序：透明度在前）。
# 自訂主題只需寫要改的項目，其餘沿用這些預設值。

[palette]               # 彈窗卡片（Control Center、啟動器、截圖、選字框…）
paper     = #d6cfb5     # 卡片底色
ink       = #463f2e     # 字、線、選取條
inkStrong = #2e2a1f     # 強調字；最深的墨色
inkSoft   = #7a7358     # 次要文字
accent    = #6e2a2a     # 選取條邊緣、標記
light     = #fff6cf     # 閃光、高光、深色底上的「選中」
warn      = #c8685c     # 警示（深色底上）
good      = #9ab58c     # 正常 / 充電中

[dark]                  # 常駐的深色面板（HUD）
panel   = #221e17       # 底色
raised  = #2e2a1f       # 軌道、凸起元件
text    = #d6cfb5       # 文字與線條
muted   = #8f8873       # 次要文字
monitors = #fff6cf, #a99bc9, #9ab58c, #c98a70   # 各螢幕的工作區標色
monthTint = 0.45       # HUD 下半部融入月曆原畫色調的程度（0 = 不融入）

[notify]
critical = #cd664d      # 緊急通知
low      = #a0c490      # 資訊通知

[sepia]                 # 媒體播放器
fg  = #c8b89a
bg  = #0b0a09
dim = #48463d

[backdrop]              # 玻璃三角形背景
triangle = #d6cfb5
glint    = #fff6cf
shade    = #463f2e

[font]
mono = "Share Tech Mono"
cjk  = "jf金萱那提2.0"

[hyprland]              # 視窗邊框（scripts/theme-sync.py；shell.conf 的 [sync] hyprland 開關）
border      = #fff6cf, #c8b89a, #b0493f   # 作用中視窗的漸層，2–3 色
borderAngle = 45
shadow      = #c8b89a     # 作用中視窗的光暈
