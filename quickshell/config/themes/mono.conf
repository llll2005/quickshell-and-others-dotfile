# Mono — 黑灰白：只有明暗，靠深淺與線條區分層次

[palette]
paper     = #e6e6e3
ink       = #262626
inkStrong = #0f0f0f
inkSoft   = #767676
accent    = #9c9c9c     # 選取條邊緣用中灰
light     = #ffffff
warn      = #ffffff     # 警示：純白（深色底上最亮）
good      = #b3b3b3

[dark]
panel    = #141414
raised   = #222222
text     = #d9d9d6
muted    = #858585
monitors = #ffffff, #c4c4c4, #9a9a9a, #6f6f6f
monthTint = 0       # HUD 下半部融入月曆原畫色調的程度（0 = 不融入）

[notify]
critical = #f2f2f2
low      = #a6a6a6

[sepia]
fg  = #dcdcdc
bg  = #0b0b0b
dim = #3d3d3d

[backdrop]
triangle = #dedede
glint    = #ffffff
shade    = #1c1c1c

[hyprland]              # 視窗邊框（scripts/theme-sync.py；shell.conf 的 [sync] hyprland 開關）
border      = #ffffff, #858585, #d9d9d6   # 作用中視窗的漸層，2–3 色
borderAngle = 45
shadow      = #9c9c9c     # 作用中視窗的光暈
