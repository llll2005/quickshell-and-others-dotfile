# Abyss — 深海：霧藍的紙、深海藍的墨、黃銅點綴（推薦）

[palette]
paper     = #d9e1e8
ink       = #1d2d3f
inkStrong = #0f1a26
inkSoft   = #6b7f93
accent    = #c99a4f     # 黃銅
light     = #f2f8ff
warn      = #e3735e
good      = #7fc2b0

[dark]
panel    = #0e1620
raised   = #182433
text     = #d9e1e8
muted    = #7f93a6
monitors = #f2f8ff, #7fb8e0, #7fc2b0, #c99a4f
monthTint = 0.25       # HUD 下半部融入月曆原畫色調的程度（0 = 不融入）

[notify]
critical = #e3735e
low      = #7fc2b0

[sepia]
fg  = #cfdbe6
bg  = #081018
dim = #2c3b4c

[backdrop]
triangle = #cfd9e3
glint    = #f2f8ff
shade    = #16263a

[hyprland]              # 視窗邊框（scripts/theme-sync.py；shell.conf 的 [sync] hyprland 開關）
border      = #7fb8e0, #7fc2b0, #c99a4f   # 作用中視窗的漸層，2–3 色
borderAngle = 45
shadow      = #7fb8e0     # 作用中視窗的光暈
