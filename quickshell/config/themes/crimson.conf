# Crimson — 紅黑白：白紙黑墨，紅色只用在選取與標記；背景三角的暗面帶深紅

[palette]
paper     = #f1eded
ink       = #1b1717
inkStrong = #0b0909
inkSoft   = #756b6b
accent    = #d0142f     # 正紅
light     = #ffffff
warn      = #ff4f63
good      = #cfcfcf

[dark]
panel    = #120f0f
raised   = #1f1a1a
text     = #f1eded
muted    = #8f8585
monitors = #ffffff, #d0142f, #8f8585, #ff7a8a
monthTint = 0.2       # HUD 下半部融入月曆原畫色調的程度（0 = 不融入）

[notify]
critical = #d0142f
low      = #b8b0b0

[sepia]
fg  = #f1eded
bg  = #0b0909
dim = #3a2e2e

[backdrop]
triangle = #e8e0e0
glint    = #ffffff
shade    = #5a0c1a      # 暗面是深紅

[hyprland]              # 視窗邊框（scripts/theme-sync.py；shell.conf 的 [sync] hyprland 開關）
border      = #ffffff, #d0142f, #ff7a8a   # 作用中視窗的漸層，2–3 色
borderAngle = 45
shadow      = #d0142f     # 作用中視窗的光暈
