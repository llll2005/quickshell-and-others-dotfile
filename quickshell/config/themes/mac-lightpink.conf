# Mac Light Pink — macOS 淺色為主：#f5f5f7 的卡片、近黑的字、石墨灰的選中；系統粉只點在邊緣、標記與火花

[palette]
paper     = #f5f5f7     # 卡片底（macOS 淺灰白）
ink       = #1d1d1f     # 字、線、選取條（墨色選取條，像 macOS 的石墨）
inkStrong = #000000
inkSoft   = #6e6e73     # 次要文字
accent    = #ff2d55     # 輔色：選取條邊緣、標記
light     = #ff2d55     # 輔色：火花、游標、高光
warn      = #ff3b30
good      = #1f9e36

[dark]                  # HUD（淺色）
panel    = #f2f2f4
raised   = #e3e3e8      # 軌道
text     = #1d1d1f
muted    = #6e6e73
active   = #48484a      # 選中日期、釘選、工作區：石墨灰（主色）
onFill   = #ffffff
monitors = #48484a, #ff2d55, #8e8e93, #aeaeb2
monthTint = 0.05

[notify]
critical = #ff3b30
low      = #ff2d55

[sepia]                 # 播放器
fg  = #1d1d1f
bg  = #f2f2f4
dim = #c7c7cc

[backdrop]
triangle = #f5f5f7
glint    = #ffffff
shade    = #a1a1a6

[hyprland]              # 視窗邊框：灰階，尾端一點輔色
border      = #aeaeb2, #e5e5ea, #ff2d55
borderAngle = 45
shadow      = #3c3c43
