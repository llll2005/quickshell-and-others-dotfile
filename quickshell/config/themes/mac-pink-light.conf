# Mac Pink Light — 粉為主角的 macOS 淺色：帶一點粉的白卡、近黑的字、#ff2d55 的邊與選中

[palette]
paper     = #fdf6f8     # 帶粉的白
ink       = #1d1d1f
inkStrong = #000000
inkSoft   = #74656b
accent    = #ff2d55     # 系統粉
light     = #ff375f
warn      = #ff3b30
good      = #1f9e36

[dark]                  # HUD（淺色）
panel    = #f9eff2
raised   = #f0dde3
text     = #1d1d1f
muted    = #7c6a70
active   = #d81b55      # 淺色 HUD 上要比 light 深，白字才讀得清
onFill   = #ffffff
monitors = #ff2d55, #af52de, #1f9e36, #ff9500
monthTint = 0.05

[notify]
critical = #ff3b30
low      = #af52de

[sepia]
fg  = #1d1d1f
bg  = #f9eff2
dim = #e8c6d1

[backdrop]
triangle = #fdf6f8
glint    = #ffffff
shade    = #c9a1ae

[hyprland]
border      = #ff375f, #ffb3c4
borderAngle = 45
shadow      = #ff375f
