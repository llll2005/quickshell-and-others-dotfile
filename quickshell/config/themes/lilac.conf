# Lilac — 粉紫色調：淡紫粉的紙、梅紫的墨、玫瑰粉點綴

[palette]
paper     = #efe4f0     # 淡紫粉紙
ink       = #5a3e6b     # 梅紫：字、線、選取條
inkStrong = #3b2649
inkSoft   = #9b82a8
accent    = #e0709f     # 玫瑰粉：選取條邊緣、標記
light     = #fff2fa
warn      = #ef6f8f
good      = #8cc4ad

[dark]                  # HUD
panel    = #231a2b
raised   = #33263d
text     = #eadcef
muted    = #a592b0
monitors = #fff2fa, #e0709f, #b79ce0, #8cc4ad
monthTint = 0.25       # HUD 下半部融入月曆原畫色調的程度（0 = 不融入）

[notify]
critical = #ef6f8f
low      = #9fd4bf

[sepia]                 # 播放器
fg  = #e8d6ef
bg  = #1a1420
dim = #4a3a55

[backdrop]
triangle = #e9d7ee
glint    = #fff2fa
shade    = #4a3160

[hyprland]              # 視窗邊框（scripts/theme-sync.py；shell.conf 的 [sync] hyprland 開關）
border      = #e0709f, #b79ce0, #eadcef   # 作用中視窗的漸層，2–3 色
borderAngle = 45
shadow      = #e0709f     # 作用中視窗的光暈
