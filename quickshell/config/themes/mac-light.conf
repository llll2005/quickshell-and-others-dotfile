# Mac Light — macOS 淺色：#f5f5f7 的卡片、近黑的字、系統藍的邊與選中；HUD 也是淺色

[palette]
paper     = #f5f5f7     # 卡片底（macOS 的淺灰白）
ink       = #1d1d1f     # 字、線、選取條
inkStrong = #000000
inkSoft   = #6e6e73     # 次要文字（macOS secondary label，加深到 4.5:1 以上）
accent    = #007aff     # 系統藍：選取條邊緣、標記
light     = #0a84ff     # 高光
warn      = #ff3b30
good      = #1f9e36     # 系統綠（淺底上加深）

[dark]                  # HUD（淺色）
panel    = #f2f2f4
raised   = #e3e3e8      # 軌道
text     = #1d1d1f
muted    = #6e6e73
active   = #0068d9      # 選中日期、釘選、標記（比系統藍深一階，白字才讀得清）
onFill   = #ffffff      # 實心色塊上的字
monitors = #007aff, #af52de, #1f9e36, #ff9500
monthTint = 0.05

[notify]
critical = #ff3b30
low      = #007aff

[sepia]                 # 播放器
fg  = #1d1d1f
bg  = #f2f2f4
dim = #c7c7cc

[backdrop]
triangle = #f5f5f7
glint    = #ffffff
shade    = #a1a1a6      # 淺灰的暗面，玻璃是亮的

[hyprland]              # 視窗邊框（scripts/theme-sync.py；shell.conf 的 [sync] hyprland 開關）
border      = #007aff, #64d2ff   # 作用中視窗的漸層，2–3 色
borderAngle = 45
shadow      = #3c3c43     # macOS 的陰影是中性的
