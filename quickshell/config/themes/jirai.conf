# Jirai — 地雷系：黑色蕾絲般的深色卡片、嬰兒粉的字與選取條、酒紅緞帶邊

[palette]
paper     = #1c1519     # 黑色卡片
ink       = #f5b3cc     # 嬰兒粉：字、線、選取條
inkStrong = #ffd9e8
inkSoft   = #b88aa0
accent    = #7a1a3a     # 酒紅：選取條邊緣
light     = #fff0f6
warn      = #ff5c8a
good      = #c9a7e8

[dark]
panel    = #120c10
raised   = #22171d
text     = #f5b3cc
muted    = #9a7486
monitors = #fff0f6, #f5b3cc, #c9a7e8, #ff5c8a
monthTint = 0.2       # HUD 下半部融入月曆原畫色調的程度（0 = 不融入）

[notify]
critical = #ff5c8a
low      = #c9a7e8

[sepia]
fg  = #f5b3cc
bg  = #0e0a0c
dim = #4a3140

[backdrop]
triangle = #2a1c24
glint    = #ffd9e8
shade    = #0b0709

[hyprland]              # 視窗邊框（scripts/theme-sync.py；shell.conf 的 [sync] hyprland 開關）
border      = #f5b3cc, #ff5c8a, #c9a7e8   # 作用中視窗的漸層，2–3 色
borderAngle = 45
shadow      = #ff5c8a     # 作用中視窗的光暈
