# Aha — 阿哈（星神・歡愉）：象牙白紙牌、緋紅的字與選取條、金框邊；深紅劇場的 HUD 與玻璃

[palette]
paper     = #f7f1ef     # 象牙白（紙牌、銀髮）
ink       = #a3121e     # 緋紅：字、線、選取條
inkStrong = #5c0a12
inkSoft   = #8f7478
accent    = #d4a63f     # 金框：選取條邊緣、標記
light     = #ffe7a3     # 金色閃光、高光
warn      = #ff4a3d
good      = #c7b6e8     # 薰衣紫（髮梢的陰影）

[dark]                  # HUD：深紅劇場
panel    = #1b0a0e
raised   = #2c1016
text     = #f7f1ef
muted    = #a58d91
monitors = #ffe7a3, #e0262b, #b9b3d6, #f7f1ef
monthTint = 0.2       # HUD 下半部融入月曆原畫色調的程度（0 = 不融入）

[notify]
critical = #e0262b
low      = #b9b3d6

[sepia]                 # 播放器
fg  = #f0d9a8
bg  = #140709
dim = #5a1a22

[backdrop]              # 紅幕玻璃
triangle = #b3121c
glint    = #ffe7a3
shade    = #1e0a0e

[hyprland]              # 視窗邊框（scripts/theme-sync.py；shell.conf 的 [sync] hyprland 開關）
border      = #ffe7a3, #c4161c, #b9b3d6   # 作用中視窗的漸層，2–3 色
borderAngle = 45
shadow      = #c4161c     # 作用中視窗的光暈
