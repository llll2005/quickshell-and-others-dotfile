# YoRHa Noir — 紙墨反轉的深色範例主題（只寫與 nier 不同的部分）
# 在 shell.conf 設 theme = yorha-noir 即可切換

[palette]
paper     = #26241f     # 卡片變深
ink       = #d9d2bc     # 字與選取條變亮
inkStrong = #f2ecd8
inkSoft   = #9c9585
accent    = #b0493f
light     = #fff6cf

[dark]
panel  = #121110
raised = #1c1a17
text   = #d9d2bc
muted  = #7d776a
monthTint = 0.3       # HUD 下半部融入月曆原畫色調的程度（0 = 不融入）

[backdrop]
triangle = #3a372f
shade    = #0c0b0a

[hyprland]              # 視窗邊框（scripts/theme-sync.py；shell.conf 的 [sync] hyprland 開關）
border      = #f2ecd8, #d9d2bc, #b0493f   # 作用中視窗的漸層，2–3 色
borderAngle = 45
shadow      = #b0493f     # 作用中視窗的光暈
