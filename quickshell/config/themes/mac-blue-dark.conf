# Mac Blue Dark — 藍為主角的 macOS 深色：#2c2c2e 的卡片、#f5f5f7 的字、系統藍（深色版）的邊與選中

[palette]
paper     = #2c2c2e     # 卡片底（macOS 深色的抬升面）
ink       = #f5f5f7     # 字、線、選取條
inkStrong = #ffffff
inkSoft   = #98989d     # 次要文字
accent    = #0a84ff     # 系統藍（深色版）
light     = #409cff     # 高光
warn      = #ff453a
good      = #32d74b

[dark]                  # HUD
panel    = #1e1e1e
raised   = #2c2c2e
text     = #f5f5f7
muted    = #98989d
active   = #0070e0      # 選中日期、釘選、標記（比系統藍深一階，白字才讀得清）
onFill   = #ffffff      # 藍色實心塊上的白字（macOS 的選取）
monitors = #0a84ff, #bf5af2, #32d74b, #ff9f0a
monthTint = 0.3

[notify]
critical = #ff453a
low      = #0a84ff

[sepia]
fg  = #f5f5f7
bg  = #1c1c1e
dim = #48484a

[backdrop]
triangle = #3a3a3c
glint    = #ffffff
shade    = #0c0c0d

[hyprland]
border      = #0a84ff, #5e5ce6
borderAngle = 45
shadow      = #000000
