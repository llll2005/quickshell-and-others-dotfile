# Mac Dark Pink — macOS 深色配系統粉（深色版）：微暖的深灰卡片、#f5f5f7 的字、#ff375f 的邊與選中

[palette]
paper     = #2d2a2c     # 帶一點暖的深灰
ink       = #f5f5f7
inkStrong = #ffffff
inkSoft   = #a0979b
accent    = #ff375f     # 系統粉（深色版）
light     = #ff6482
warn      = #ff453a
good      = #32d74b

[dark]                  # HUD
panel    = #1f1c1e
raised   = #2e2a2d
text     = #f5f5f7
muted    = #9d9498
active   = #e0294f      # 比系統粉深一階，白字才讀得清
onFill   = #ffffff
monitors = #ff375f, #bf5af2, #32d74b, #ff9f0a
monthTint = 0.25

[notify]
critical = #ff453a
low      = #bf5af2

[sepia]
fg  = #f5f5f7
bg  = #1c1a1b
dim = #4a4448

[backdrop]
triangle = #3a3538
glint    = #ffd1dc
shade    = #0d0b0c

[hyprland]
border      = #ff375f, #bf5af2
borderAngle = 45
shadow      = #ff375f
