# Mac Dark — macOS 深色為主：#2c2c2e 的卡片、#f5f5f7 的字、白色的選中；系統藍只點在邊緣、標記與火花

[palette]
paper     = #2c2c2e     # 卡片底（macOS 深色抬升面）
ink       = #f5f5f7     # 字、線、選取條
inkStrong = #ffffff
inkSoft   = #98989d
accent    = #0a84ff     # 輔色：選取條邊緣、標記
light     = #f5f5f7     # 深色底上的「選中」：白（主色）
warn      = #ff453a
good      = #32d74b

[dark]                  # HUD
panel    = #1e1e1e
raised   = #2c2c2e
text     = #f5f5f7
muted    = #98989d
active   = #f5f5f7      # 選中日期、釘選、工作區：白塊
onFill   = #1d1d1f      # 白塊上的黑字
monitors = #f5f5f7, #0a84ff, #8e8e93, #636366
monthTint = 0.3

[notify]
critical = #ff453a
low      = #0a84ff

[sepia]
fg  = #f5f5f7
bg  = #1c1c1e
dim = #48484a

[backdrop]
triangle = #3a3a3c
glint    = #64d2ff
shade    = #0c0c0d

[hyprland]              # 視窗邊框：灰階，尾端一點輔色
border      = #636366, #aeaeb2, #0a84ff
borderAngle = 45
shadow      = #000000
