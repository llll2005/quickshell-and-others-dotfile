// qs-firefox.cfg — autoconfig (the first line must be a comment). Installed as
// /usr/lib/firefox/qs-firefox.cfg by dotfiles/system/firefox-live.sh; it only runs the
// user's ~/.config/quickshell/firefox/live.js, so later changes need no sudo.
// (Firefox refuses loadSubScript for file: URLs: read the file, run it in a system sandbox.)
try {
  const { classes: Cc, interfaces: Ci, utils: Cu } = Components;
  const f = Services.dirsvc.get("Home", Ci.nsIFile);
  for (const part of [".config", "quickshell", "firefox", "live.js"]) f.append(part);
  if (f.exists()) {
    const s = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
    s.init(f, 0x01, 0, 0);
    const c = Cc["@mozilla.org/intl/converter-input-stream;1"].createInstance(Ci.nsIConverterInputStream);
    c.init(s, "UTF-8", 0, 0);
    let text = "", part = {};
    while (c.readString(0xffff, part)) text += part.value;
    c.close();
    const sb = Cu.Sandbox(Services.scriptSecurityManager.getSystemPrincipal(),
                          { wantComponents: true, sandboxName: "quickshell live.js" });
    sb.Services = Services;
    Cu.evalInSandbox(text, sb, "latest", Services.io.newFileURI(f).spec, 1);
  }
} catch (e) {
  Components.utils.reportError("qs-firefox.cfg: " + e);
}
