general {
    # the shell's lock (quickshell/lock.qml); lock.sh falls back to hyprlock if it fails
    lock_cmd         = ~/.config/quickshell/scripts/lock.sh
    # sleep itself is the shell's (quickshell/widgets/Welcome.qml holds logind's delay lock):
    # it draws the Void's dark, or locks first when shell.conf says [void] lockOnSleep = true
    inhibit_sleep    = 0
    after_sleep_cmd  = ~/.config/hypr/scripts/dpms.py on
}

# 階段一：調暗螢幕到 10% (4 分鐘 = 240 秒)
listener {
    timeout  = 240
    on-timeout  = logger -t hypridle "[DIM] Dimming to 10%" && brightnessctl -s set 10% && logger -t hypridle "[DIM] Current brightness: $(brightnessctl get)"
    on-resume   = logger -t hypridle "[DIM] Restoring brightness" && brightnessctl -r && logger -t hypridle "[DIM] Restored to: $(brightnessctl get)"
}

# 階段二：關閉螢幕 (7 分鐘 = 420 秒)
listener {
    timeout  = 420
    # dpms.py, not a bare dispatch: a DisplayPort monitor in standby replugs itself and
    # Hyprland lights it again — the script keeps it off until there's real activity
    on-timeout = logger -t hypridle "[DPMS] Turning off screen" && ~/.config/hypr/scripts/dpms.py off
    on-resume  = logger -t hypridle "[DPMS] Turning on screen" && ~/.config/hypr/scripts/dpms.py on
}

