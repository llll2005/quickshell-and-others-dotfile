general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 階段一：調暗螢幕到 10% (4 分鐘 = 240 秒)
listener {
    timeout  = 240
    on-timeout  = logger -t hypridle "[DIM] Dimming to 10%" && brightnessctl -s set 10% && logger -t hypridle "[DIM] Current brightness: $(brightnessctl get)"
    on-resume   = logger -t hypridle "[DIM] Restoring brightness" && brightnessctl -r && logger -t hypridle "[DIM] Restored to: $(brightnessctl get)"
}

# 階段二：關閉螢幕 (7 分鐘 = 420 秒)
listener {
    timeout  = 420
    on-timeout = logger -t hypridle "[DPMS] Turning off screen" && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = logger -t hypridle "[DPMS] Turning on screen" && hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

