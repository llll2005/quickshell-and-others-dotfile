# ── boot-void: the look (dotfiles/system/boot-void.sh) ──
# Black, the backdrop (a diamond, SELECT SYSTEM, the hairline, the keys), Operator Mono
# in Limine's cells, the pick as a white block. The entries below are limine-entry-tool's
# (limine-update / limine-mkinitcpio keep them), Windows is boot-void's.
timeout: 3
default_entry: 2
remember_last_entry: yes
interface_branding:
interface_help_hidden: yes
interface_help_colour: 9a9a9a
wallpaper: boot():/void/void.png
wallpaper_style: centered
backdrop: 000000
term_font: boot():/void/void.f16
term_font_size: 8x16
term_font_scale: 2x2
term_font_spacing: 0
term_margin: 64
term_margin_gradient: 0
term_background: ff000000
term_foreground: dcdcdc
term_foreground_bright: ffffff
term_palette: 010101;b8403c;9ab58c;d9b46a;8fa6d0;c48fb0;7fb7b0;9a9a9a
term_palette_bright: 555555;d05a55;b4cfa6;efcc85;aec4ec;dcaecb;9fd4cd;ffffff
# ── end boot-void ──

