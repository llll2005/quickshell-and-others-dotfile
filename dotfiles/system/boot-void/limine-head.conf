# ── boot-void: the look (dotfiles/system/boot-void.sh) ──
# Black, the backdrop (a diamond, SELECT SYSTEM, the hairline, the keys), Operator Mono
# in Limine's cells, the pick as a white block. limine-entry-tool rewrites everything else
# (its template header, the entries); /etc/boot/hooks/post.d/80-boot-void-look puts this
# block back after each of its writes. Windows is boot-void's.
timeout: 3
default_entry: 2
remember_last_entry: yes
# the panel's own mode: the framebuffer Limine hands the kernel is then already native, and
# Plymouth doesn't start at one size and land at another
interface_resolution: 1920x1200
interface_branding:
interface_help_hidden: yes
interface_help_colour: 9a9a9a
wallpaper: boot():/void/void.png
wallpaper_style: centered
backdrop: 000000
term_font: boot():/void/void.f16
term_font_size: 8x16
term_font_scale: 2x2
term_font_spacing: 0
term_margin: 64
term_margin_gradient: 0
term_background: ff000000
term_foreground: dcdcdc
term_foreground_bright: ffffff
term_palette: 010101;b8403c;9ab58c;d9b46a;8fa6d0;c48fb0;8a8a8a;9a9a9a
term_palette_bright: 555555;d05a55;b4cfa6;efcc85;aec4ec;dcaecb;b0b0b0;ffffff
# ── end boot-void ──

